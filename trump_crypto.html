<script>

const moneyDisplay = document.getElementById('moneyDisplay'); 
const revenueFromTradingFees = 320000000; //https://www.nytimes.com/interactive/2025/07/02/business/donald-trump-wealth-net-worth.html
// was 100,000,00, per Reuters: www.reuters.com/markets/currencies/trumps-meme-coin-made-nearly-100-million-trading-fees-small-traders-lost-money-2025-02-03/
const revenueFromForeignPurchases = 100000000; // https://www.reuters.com/press-releases/aqua-1-announces-100m-strategic-world-liberty-financial-governance-token-purchase-to-help-shape-and-accelerate-decentralized-finance-adoption-2025-06-26/
const worldLibertyTokenRevenue = 550000000; // https://www.nytimes.com/interactive/2025/07/02/business/donald-trump-wealth-net-worth.html


/////////////////////////////////Time ////////////////////////////////////////////////////////////
const refreshInterval = 1000.0; // Time in milliseconds
const secondsInYear = 31536000; // 365 days in a year * 24 hours in a day * 60 minutes in an hour * 60 seconds in a minute
                                // As a stand in for the number of periods increasing for holding the stablecoin collateral
                                // in 1 month T-bills

/////////////////////////////////Static Money Values Revenue////////////////////////////////////////////////////

const wlfSalesRevenue = 1593750000;
const memecoinSales = 336000000;
const memecoinTradingFees = 320000000;
const lastCacheDate = new Date('2026.01.13');
const cachedUSD1Carry = 27636437.77;
const staticRevenue = wlfSalesRevenue + memecoinSales + memecoinTradingFees + cachedUSD1Carry;

const twelveMonthAnnualReturnFRGXX = .0424; // taken from https://fundresearch.fidelity.com/mutual-funds/summary/31607A703 (accessed Jan. 13, 2026)
const perSecondRate = twelveMonthAnnualReturnFRGXX / secondsInYear



//////////////////////////////////////////USD1 Quantity pull /////////////////////////////////////////////////

const defaultUSD1QuantityForFallback = 3400000000;
const supplyField = 'circulating_supply';
const coinGeckApiUrl = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=usd1-wlfi";
const apiOptions = { "headers": {"x-api-key": "CG-ECJq3yLPcbdMuWpMdR8ew4Wo", 'Access-Control-Allow-Origin': 'https://api.coingecko.com/*'}};
async function callGeckoApi(url, options, handler) {
  try {
    usd1Quantity = await fetch(url, options).then(res => res.json()).then(data => handler(data));
    return usd1Quantity;

  } catch (error) {
    console.error(error);
    console.log('Failed to pull from gecko Api so using fallback ' + usd1Quantity);
    return defaultUSD1QuantityForFallback
  } 
}

function handleApiResponse(geckData) {
  try{
    return geckData[0][supplyField];
  } catch (error) {
    console.log(error);
    return defaultUSD1QuantityForFallback;
  }
};

//////////////////////////////////////////Utilities /////////////////////////////////////////////////


function getSecondsSinceLastCache(cacheDate) {
  let now = new Date();
  return (now.getTime() - cacheDate.getTime()) / 1000;
}

const formatter = new Intl.NumberFormat('en-US', {style: 'currency', currency: 'USD'});

//////////////////////////////////////////Do the thing /////////////////////////////////////////////////

usd1Quantity = callGeckoApi(coinGeckApiUrl, apiOptions, handleApiResponse)
//Lots of global variable use... \shrug I'm not a great js dev
function updateMoneyDisplay() {
  console.log(`Using usd1Quantity ${usd1Quantity}`);
  secondsOfInterest = getSecondsSinceLastCache(lastCacheDate)
  let perSecondInterestEarned = perSecondRate * usd1Quantity;
  let interestEarned = secondsOfInterest * perSecondInterestEarned;
  let currentMoney = staticRevenue + interestEarned;
  console.log(`interestEarned: ${interestEarned}`);

  let formattedMoney = formatter.format(currentMoney);

  moneyDisplay.textContent = formattedMoney;
}

updateMoneyDisplay();
const animationInterval = setInterval(updateMoneyDisplay, refreshInterval);


</script>
